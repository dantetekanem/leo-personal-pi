# Enable mouse support, including wheel scrolling
set -g mouse on

# Enable modified key reporting for terminals that support it
set -g extended-keys on

# Allow image protocols / advanced terminal escapes through tmux
set -gq allow-passthrough on
set -g visual-activity off

# Dynamic terminal/window titles for Ghostty
set -g set-titles on
set -g set-titles-string '#S · #W'

# Close tmux sessions when their last Ghostty/terminal tab closes
set -g destroy-unattached on

# Put the status area at the top. Keep the overall bar transparent/default,
# apply the pink accent background only to the left status text and current window,
# and draw a separator border along the bottom of the status area.
set -g status-position top
set -g status 2
set -g status-style fg=default,bg=default
set -g status-left-style fg=default,bg=default
set -g status-left ' #[fg=black,bg=#e85aa8] #S '
set -g window-status-style fg=default,bg=default
set -g window-status-current-style fg=black,bg=#e85aa8
set -g window-status-current-format '#I:#W#{?window_flags,#{window_flags}, } '
set -g status-right-style fg=default,bg=default
set -g status-right '%H:%M %d-%b-%y'
set -g status-format[1] '#[fg=colour238,bg=default]#{R:─,#{client_width}}'

# Keep tmux window names useful as commands change
setw -g automatic-rename on
setw -g automatic-rename-format '#{pane_current_command}'

# Open new tmux windows from the active pane's current directory.
# This makes prefix + c behave like Ghostty's cwd inheritance for new tabs.
bind c new-window -c "#{pane_current_path}"

set -g extended-keys-format csi-u

# Resize panes with prefix + h/j/k/l. Repeatable while held after prefix.
# Uppercase variants stay bound too, in case muscle memory expects Shift-H/J/K/L.
bind -r h resize-pane -L 5
bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Resize mode: prefix + r, then h/j/k/l repeatedly without pressing prefix again.
bind r switch-client -T resize \; display-message "resize mode: h/j/k/l, q or Escape to quit"
bind -T resize h resize-pane -L 5 \; switch-client -T resize
bind -T resize j resize-pane -D 5 \; switch-client -T resize
bind -T resize k resize-pane -U 5 \; switch-client -T resize
bind -T resize l resize-pane -R 5 \; switch-client -T resize
bind -T resize H resize-pane -L 5 \; switch-client -T resize
bind -T resize J resize-pane -D 5 \; switch-client -T resize
bind -T resize K resize-pane -U 5 \; switch-client -T resize
bind -T resize L resize-pane -R 5 \; switch-client -T resize
bind -T resize q switch-client -T prefix
bind -T resize Escape switch-client -T prefix
